services:
  web:
    build: .
    image: mini-shop-ng:latest
    ports:
      - '8080:80'
    environment:
      # Public URL of the separately-deployed backend. On Railway, for instance:
      # API_UPSTREAM: https://<backend-yourapp>.up.railway.app
      # Locally, a Docker service name or the host:
      API_UPSTREAM: http://host.docker.internal:3000
    restart: unless-stopped

  # Your JSON Server backend lives in its own repository. Uncomment and adapt
  # this service so `docker compose up` starts everything at once (and set
  # API_UPSTREAM above to http://backend:3000):
  #
  # backend:
  #   image: node:22-alpine
  #   working_dir: /app
  #   volumes:
  #     - ./server:/app
  #   command: sh -c "npm ci && npx json-server --watch db.json --port 3000"
  #   restart: unless-stopped
