<div class="verify">
  <h2 class="verify__title saas-auth__title">Vérification de l'email</h2>

  @if (status() === 'loading') {
    <div class="saas-alert saas-alert--info verify__status" role="status">
      <span class="saas-spinner" aria-hidden="true"></span>
      <span>Vérification en cours…</span>
    </div>
  } @else if (status() === 'success') {
    <div class="saas-alert saas-alert--success verify__status" role="status">
      <svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 9.7a1 1 0 1 1 1.4-1.4l3.8 3.8 6.8-6.8a1 1 0 0 1 1.4 0Z"
          clip-rule="evenodd"
        />
      </svg>
      <span>Votre email a été vérifié. Vous pouvez maintenant vous connecter.</span>
    </div>
  } @else {
    <div class="saas-alert saas-alert--danger verify__status" role="alert">
      <svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16ZM8.3 6.9a1 1 0 0 1 1.4 1.4L8.4 9.6l1.2 1.2a1 1 0 1 1-1.4 1.4l-1.2-1.2-1.2 1.2a1 1 0 1 1-1.4-1.4l1.2-1.2-1.2-1.2a1 1 0 0 1 1.4-1.4l1.2 1.2 1.2-1.2a1 1 0 0 1 1.4 0Z"
          clip-rule="evenodd"
        />
      </svg>
      <span>Le lien de vérification est invalide ou a expiré.</span>
    </div>
  }

  <a class="saas-btn saas-btn--primary saas-btn--block verify__btn" routerLink="/auth/login">
    Aller à la connexion
  </a>
</div>
