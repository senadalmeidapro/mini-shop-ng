<nav class="saas-btn-group" role="tablist" aria-label="Navigation commandes">
  <button
    type="button"
    class="saas-btn saas-btn--secondary"
    role="tab"
    [attr.aria-selected]="active() === 'cart'"
    (click)="select('cart')"
  >
    <svg viewBox="0 0 20 20" width="15" height="15" fill="currentColor" aria-hidden="true">
      <path d="M3 4a1 1 0 0 1 1-1h3l1.5 1.5H16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4Z" />
    </svg>
    Mon panier
    @if (itemCount() > 0) {
      <span class="saas-badge saas-badge--neutral">{{ itemCount() }}</span>
    }
  </button>

  <button
    type="button"
    class="saas-btn saas-btn--secondary"
    role="tab"
    [attr.aria-selected]="active() === 'orders'"
    (click)="select('orders')"
  >
    <svg viewBox="0 0 20 20" width="15" height="15" fill="currentColor" aria-hidden="true">
      <path
        d="M4 3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1h1a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h1V3Zm2 1h8V3H6v1Zm9 3v9H5V7h10Z"
      />
    </svg>
    Mes commandes
  </button>
</nav>
