<div class="saas" [class.saas--collapsed]="collapsed()" [class.saas--open]="mobileOpen()">
  <button
    type="button"
    class="saas__backdrop"
    aria-label="Fermer le menu"
    (click)="closeMobile()"
  ></button>

  <aside class="saas__sidebar">
    <a routerLink="/supplier" class="saas__brand" (click)="closeMobile()">
      <span class="saas__brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="19" height="19" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M3 3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v2a3 3 0 0 1-2 2.83V17a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7.83A3 3 0 0 1 2 5V3Zm1 4.83V16h10V7.83A3 3 0 0 0 15 5H5a3 3 0 0 0-1 2.83ZM5 4v1h10V4H5Z"
            clip-rule="evenodd"
          />
        </svg>
      </span>
      <span class="saas__brand-text">
        <strong>Espace vendeur</strong>
        <span>Fournisseur</span>
      </span>
    </a>

    <nav class="saas__nav" aria-label="Navigation fournisseur">
      <div class="saas__nav-group">
        <p class="saas__nav-label">Pilotage</p>
        <a
          class="saas__nav-link"
          routerLink="/supplier"
          routerLinkActive="saas__nav-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobile()"
        >
          <svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path
              d="M2.5 7A1.5 1.5 0 0 1 4 5.5h3A1.5 1.5 0 0 1 8.5 7v8A1.5 1.5 0 0 1 7 16.5H4A1.5 1.5 0 0 1 2.5 15V7Zm9-3A1.5 1.5 0 0 1 13 2.5h3A1.5 1.5 0 0 1 17.5 4v4A1.5 1.5 0 0 1 16 9.5h-3A1.5 1.5 0 0 1 11.5 8V4Zm0 7A1.5 1.5 0 0 1 13 9.5h3a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5v-4ZM2.5 17A1.5 1.5 0 0 1 4 15.5h3A1.5 1.5 0 0 1 8.5 17a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 17Z"
            />
          </svg>
          <span>Tableau de bord</span>
        </a>
      </div>

      <div class="saas__nav-group">
        <p class="saas__nav-label">Activité</p>
        <a
          class="saas__nav-link"
          routerLink="/supplier/products"
          routerLinkActive="saas__nav-link--active"
          (click)="closeMobile()"
        >
          <svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M10 2a1 1 0 0 1 .6.2l6 4A1 1 0 0 1 17 7v6a1 1 0 0 1-.4.8l-6 4a1 1 0 0 1-1.2 0l-6-4A1 1 0 0 1 3 13V7a1 1 0 0 1 .4-.8l6-4A1 1 0 0 1 10 2Zm0 2.2L5.5 7 10 9.8 14.5 7 10 4.2ZM5 8.7v4.6l4 2.7v-4.6L5 8.7Zm6 7.3 4-2.7V8.7l-4 2.7V16Z"
              clip-rule="evenodd"
            />
          </svg>
          <span>Mes produits</span>
        </a>
        <a
          class="saas__nav-link"
          routerLink="/supplier/orders"
          routerLinkActive="saas__nav-link--active"
          (click)="closeMobile()"
        >
          <svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M4 3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1h1a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h1V3Zm2 1h8V3H6v1Zm9 3v9H5V7h10Z"
              clip-rule="evenodd"
            />
          </svg>
          <span>Commandes reçues</span>
        </a>
      </div>
    </nav>

    <div class="saas__sidebar-foot">
      <a routerLink="/" class="saas__nav-link" (click)="closeMobile()">
        <svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path d="M8.5 3a.5.5 0 0 1 .8-.4l7 5.5a.5.5 0 0 1 0 .8l-7 5.5a.5.5 0 0 1-.8-.4V3Z" />
        </svg>
        <span>Voir la boutique</span>
      </a>
    </div>
  </aside>

  <div class="saas__main">
    <header class="saas__topbar">
      <button
        type="button"
        class="saas__toggle saas__toggle--menu"
        aria-label="Ouvrir le menu"
        (click)="toggleMobile()"
      >
        <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M2 4.75A.75.75 0 0 1 2.75 4h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 4.75Zm0 5.25a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 10Zm0 5.25a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1-.75-.75Z"
            clip-rule="evenodd"
          />
        </svg>
      </button>

      <button
        type="button"
        class="saas__toggle saas__toggle--collapse"
        aria-label="Réduire le menu"
        (click)="toggleCollapsed()"
      >
        <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.83 10l3.94 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.24a.75.75 0 0 1 0-1.08l4.5-4.24a.75.75 0 0 1 1.06.02Z"
            clip-rule="evenodd"
          />
        </svg>
      </button>

      <div class="saas__topbar-title">
        <h1>Espace fournisseur</h1>
        <p>Pilotez votre catalogue, vos stocks et vos commandes au même endroit.</p>
      </div>

      <div class="saas__topbar-actions">
        <a routerLink="/orders" class="saas__icon-btn" aria-label="Mes commandes">
          <svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M4 3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1h1a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h1V3Zm2 1h8V3H6v1Zm9 3v9H5V7h10Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>

        <a routerLink="/profile" class="saas__user">
          <!-- <span class="saas-avatar saas-avatar--sm">{{ initials() }}</span> -->
          <span class="saas__user-meta">
            <strong>{{ user()?.fullName ?? 'Vendeur' }}</strong>
            <span>{{ role() }}</span>
          </span>
        </a>
      </div>
    </header>

    <main class="saas__content">
      <router-outlet />
    </main>
  </div>
</div>
